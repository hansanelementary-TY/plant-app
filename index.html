<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>덩굴식물 관찰일지</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: sans-serif;
  background: #f1f8e9;
  margin: 0;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 10px;
}

h1 {
  text-align: center;
  color: #558b2f;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.btn {
  background: #aed581;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
}

.icon {
  font-size: 40px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-top: 10px;
}

input, select, textarea, button {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
}

button {
  background: #7cb342;
  color: white;
  border: none;
  border-radius: 8px;
}

img {
  width: 100%;
  margin-top: 5px;
  border-radius: 10px;
}

.page { display:none; }
.active { display:block; }
</style>
</head>

<body>

<div class="container">

<h1>🌱 덩굴식물 관찰일지</h1>

<div id="main" class="page active">
<div class="grid">
<div class="btn" onclick="openForm('작두콩')"><div class="icon">🌿</div>작두콩</div>
<div class="btn" onclick="openForm('향기밤나팔꽃')"><div class="icon">🌸</div>향기밤나팔꽃</div>
<div class="btn" onclick="openForm('하늘마')"><div class="icon">🍃</div>하늘마</div>
<div class="btn" onclick="openForm('조롱박')"><div class="icon">🎃</div>조롱박</div>
<div class="btn" onclick="openForm('강낭콩')"><div class="icon">🫘</div>강낭콩</div>
<div class="btn" onclick="openForm('수세미')"><div class="icon">🥒</div>수세미</div>
</div>

<button onclick="showPage('listPage'); loadData()">📒 기록보기</button>
<button onclick="showPage('chartPage')">📊 그래프</button>
</div>

<div id="formPage" class="page">
<div class="card">

<h3 id="plantTitle"></h3>

<select id="student">
<option>방가람</option>
<option>김시우</option>
<option>김도하</option>
<option>김도후</option>
<option>문수민</option>
<option>위주청</option>
<option>박지준</option>
</select>

<input type="date" id="date">
<input type="number" id="height" placeholder="키(cm)">
<textarea id="note" placeholder="관찰 내용"></textarea>
<input type="file" id="image">

<button onclick="save()">저장하기</button>
<button onclick="showPage('main')">뒤로가기</button>

</div>

<div class="card">
<button onclick="helper()">🤖 관찰 도우미</button>
<div id="helper"></div>
</div>
</div>

<div id="listPage" class="page">
<div class="card">
<button onclick="showPage('main')">홈</button>
<div id="list"></div>
</div>
</div>

<div id="chartPage" class="page">
<div class="card">

<select id="plantSelect">
<option>작두콩</option>
<option>향기밤나팔꽃</option>
<option>하늘마</option>
<option>조롱박</option>
<option>강낭콩</option>
<option>수세미</option>
</select>

<button onclick="drawChart()">그래프 보기</button>
<button onclick="showPage('main')">홈</button>

<canvas id="chart"></canvas>

</div>
</div>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://libietxuqikakscgpojz.supabase.co",
  "sb_publishable_-VuK4qBnW1MLplXEm6gUGw_xDENugaK"
);

let currentPlant = "";

// 화면 전환
window.showPage = (id) => {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
};

// 식물 선택
window.openForm = (p) => {
  currentPlant = p;
  document.getElementById("plantTitle").innerText = p;
  document.getElementById("date").valueAsDate = new Date();
  showPage("formPage");
};

// 저장
window.save = async () => {
  const studentVal = document.getElementById("student").value;
  const dateVal = document.getElementById("date").value;
  const noteVal = document.getElementById("note").value;

  if (!studentVal || !dateVal || !noteVal) {
    alert("필수 입력을 확인하세요");
    return;
  }

  await supabase.from("observations").insert([{
    student_name: studentVal,
    plant_name: currentPlant,
    date: dateVal,
    note: noteVal
  }]);

  alert("저장 완료");
};

// 기록 보기
window.loadData = async () => {
  const { data } = await supabase.from("observations").select("*");

  document.getElementById("list").innerHTML = data.map(d => `
    <div>
    <b>${d.student_name}</b> (${d.plant_name})<br>
    ${d.date}<br>
    ${d.note}
    <hr>
    </div>
  `).join("");
};

// 그래프
window.drawChart = async () => {
  const plant = document.getElementById("plantSelect").value;

  const { data } = await supabase
    .from("observations")
    .select("*")
    .eq("plant_name", plant);

  new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels: data.map(d => d.date),
      datasets: [{
        data: data.map(d => d.height || 0),
        borderColor: "green"
      }]
    }
  });
};

// 도우미
window.helper = () => {
  const msgs = [
    "잎의 변화를 관찰해보세요!",
    "줄기의 길이를 재보세요!",
    "어제와 비교해보세요!"
  ];
  document.getElementById("helper").innerText =
    msgs[Math.floor(Math.random() * msgs.length)];
};
</script>

</body>
</html>
