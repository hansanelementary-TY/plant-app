<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>덩굴식물 관찰일지</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: sans-serif;
  background: #f1f8e9;
  margin: 0;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 10px;
}

h1 {
  text-align: center;
  color: #558b2f;
}

/* 식물 버튼 */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.btn {
  background: #aed581;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  font-size: 18px;
}

.icon {
  font-size: 40px;
}

/* 카드 */
.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-top: 10px;
}

input, select, textarea, button {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
}

button {
  background: #7cb342;
  color: white;
  border: none;
  border-radius: 8px;
}

img {
  width: 100%;
  margin-top: 5px;
  border-radius: 10px;
}

.page { display:none; }
.active { display:block; }
</style>
</head>

<body>

<div class="container">

<h1>🌱 덩굴식물 관찰일지</h1>

<!-- ✅ 메인 -->
<div id="main" class="page active">
<div class="grid">
<div class="btn" onclick="openForm('작두콩')"><div class="icon">🌿</div>작두콩</div>
<div class="btn" onclick="openForm('향기밤나팔꽃')"><div class="icon">🌸</div>향기밤나팔꽃</div>
<div class="btn" onclick="openForm('하늘마')"><div class="icon">🍃</div>하늘마</div>
<div class="btn" onclick="openForm('조롱박')"><div class="icon">🎃</div>조롱박</div>
<div class="btn" onclick="openForm('강낭콩')"><div class="icon">🫘</div>강낭콩</div>
<div class="btn" onclick="openForm('수세미')"><div class="icon">🥒</div>수세미</div>
</div>

<button onclick="show('listPage');loadData()">📒 기록보기</button>
<button onclick="show('chartPage')">📊 성장그래프</button>
</div>

<!-- ✅ 입력 -->
<div id="formPage" class="page">
<div class="card">

<h3 id="plantTitle"></h3>

<select id="student">
<option>방가람</option>
<option>김시우</option>
<option>김도하</option>
<option>김도후</option>
<option>문수민</option>
<option>위주청</option>
<option>박지준</option>
</select>

<input type="date" id="date">
<input type="number" id="height" placeholder="키(cm)">
<textarea id="note" placeholder="관찰 내용"></textarea>
<input type="file" id="image">

<button onclick="save()">저장하기</button>
<button onclick="show('main')">뒤로가기</button>

</div>

<div class="card">
<button onclick="helper()">🤖 관찰 도우미</button>
<div id="helper"></div>
</div>
</div>

<!-- ✅ 기록 -->
<div id="listPage" class="page">
<div class="card">
<button onclick="show('main')">홈</button>
<div id="list"></div>
</div>
</div>

<!-- ✅ 그래프 -->
<div id="chartPage" class="page">
<div class="card">

<select id="plantSelect">
<option>작두콩</option>
<option>향기밤나팔꽃</option>
<option>하늘마</option>
<option>조롱박</option>
<option>강낭콩</option>
<option>수세미</option>
</select>

<button onclick="drawChart()">그래프 보기</button> 
<button onclick="show('main')">홈</button>

<canvas id="chart"></canvas>

</div>
</div>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient("https://libietxuqikakscgpojz.supabase.co","sb_publishable_-VuK4qBnW1MLplXEm6gUGw_xDENugaK");

let currentPlant = "";

// 화면
window.show = (id)=>{
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
};

// 식물 선택
window.openForm = (p)=>{
 currentPlant=p;
 document.getElementById("plantTitle").innerText=p;
 document.getElementById("date").valueAsDate=new Date();
 show("formPage");
};

// 저장
window.save = async () => {

  try {
    // ✅ 값 가져오기
    const studentVal = document.getElementById("student").value;
    const dateVal = document.getElementById("date").value;
    const heightVal = document.getElementById("height").value;
    const noteVal = document.getElementById("note").value;
    const file = document.getElementById("image").files[0];

    // ✅ 필수값 체크
    if (!studentVal || !dateVal || !noteVal) {
      alert("학생, 날짜, 관찰내용은 반드시 입력하세요!");
      return;
    }

    let imageUrl = "";

    // ✅ 이미지 업로드
    if (file) {
      const ext = file.name.split('.').pop();
      const fileName = Date.now() + "_" + Math.random().toString(36).slice(2) + "." + ext;

      const { error: uploadError } = await supabase.storage
        .from("plant-images")
        .upload(fileName, file, {
          contentType: file.type
        });

      if (uploadError) {
        console.error("업로드 오류:", uploadError);
        alert("사진 업로드 실패: " + uploadError.message);
        return;
      }

      const { data } = supabase.storage
        .from("plant-images")
        .getPublicUrl(fileName);

      imageUrl = data.publicUrl;
    }

    // ✅ DB 저장
    const { error: insertError } = await supabase
      .from("observations")
      .insert([{
        student_name: studentVal,
        plant_name: currentPlant,
        date: dateVal,
        height: heightVal || null,
        note: noteVal,
        image_url: imageUrl
      }]);

    if (insertError) {
      console.error("DB 저장 오류:", insertError);
      alert("저장 실패: " + insertError.message);
      return;
    }

    alert("✅ 저장 완료!");

    // ✅ 입력 초기화
    document.getElementById("note").value = "";
    document.getElementById("height").value = "";
    document.getElementById("image").value = "";

  } catch (err) {
    console.error("전체 오류:", err);
    alert("예상치 못한 오류 발생");
  }
};


// 기록 보기
window.loadData = async ()=>{
 const { data } = await supabase
 .from("observations")
 .select("*")
 .order("date",{ascending:false});

 list.innerHTML = data.map(d=>`
 <div>
 <b>${d.student_name}</b> (${d.plant_name})<br>
 ${d.date}<br>${d.note}
 ${d.image_url?`<img src="${d.image_url}">`:""}
 <hr>
 </div>
 `).join("");
};

// 그래프
window.drawChart = async ()=>{
 const plant = plantSelect.value;

 const { data } = await supabase
 .from("observations")
 .select("*")
 .eq("plant_name",plant);

 new Chart(chart,{
  type:"line",
  data:{
   labels:data.map(d=>d.date),
   datasets:[{
    data:data.map(d=>d.height||0),
    borderColor:"#4caf50"
   }]
  }
 });
};

// 도우미
window.helper = ()=>{
 const msg=[
 "잎의 크기와 색을 살펴보세요!",
 "줄기의 길이를 재보세요!",
 "어제와 달라진 점은 무엇인가요?",
 "꽃이나 열매가 생겼나요?",
 "촉감이나 냄새도 느껴보세요!"
 ];
 helper.innerText = msg[Math.random()*msg.length|0];
};
</script>

</body>
</html>
